name: Build, Sign, Package, and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install WiX Toolset CLI
      run: dotnet tool install --global wix --version 7.0.0

    - name: Accept WiX OSMF EULA
      run: wix eula accept wix7
      shell: pwsh

    - name: Install WiX Extensions
      run: |
        wix extension add --global WixToolset.UI.wixext/7.0.0
        wix extension add --global WixToolset.Util.wixext/7.0.0

    - name: Publish WPF Application
      run: dotnet publish "Sylver Ink.csproj" -c Release --runtime win-x64 --self-contained true -o ./publish/win-x64

    - name: Build Raw MSI Installers
      run: |
        dotnet restore -r win-x64 ./SI_Setup/SI_Setup.wixproj
        msbuild ./SI_Setup/SI_Setup.wixproj -p:Configuration=Release -p:Platform=x64
      shell: pwsh

    # TODO: Certificate signing goes here

    - name: Run Localization & WiX Batch Script
      id: locate-sdk
      run: |
        $sdkFolder = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*" `
            -Filter "msitran.exe" -Recurse |
            Where-Object { $_.FullName -match '\\x86\\' } |
            Select-Object -First 1 -ExpandProperty DirectoryName

        if (-not $sdkFolder) { throw "Could not locate msitran.exe in the Windows SDK" }

        Write-Host "Found Windows SDK Tools path at: $sdkFolder"
        $env:SdkPath = $sdkFolder
        & .\AuthorMSI.bat
      shell: pwsh

    - name: Generate SHA-256 checksum
      shell: pwsh
      run: |
        $hash = (Get-FileHash ./SylverInk.msi -Algorithm SHA256).Hash.ToLower()
        "$hash  SylverInk.msi" | Out-File -Encoding ascii -NoNewline ./SylverInk.msi.sha256

    - name: Upload Final Multilingual MSI Installer
      uses: actions/upload-artifact@v4
      with:
        name: SylverInk-Installer
        path: |
          ./SylverInk.msi
          ./SylverInk.msi.sha256

    - name: Create Release and Upload Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        body_path: ./CHANGELOG
        files: |
          ./SylverInk.msi
          ./SylverInk.msi.sha256

  rebuild-site:
    needs: build-and-package
    runs-on: ubuntu-latest

    steps:
      - name: Post Cloudflare Deploy Hook
        run: curl -fsSL -X POST "${{ secrets.CF_DEPLOY_HOOK }}"

